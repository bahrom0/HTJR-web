[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tajik-htr-studio-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.13.4",
  "numpy==2.2.3",
  "pillow==11.1.0",
  "opencv-python-headless==5.0.0.93",
  "torch==2.13.0+cpu",
  "torchvision==0.28.0+cpu",
  "transformers==4.57.6",
  "peft==0.18.0",
  "safetensors==0.5.3",
  "protobuf==6.33.5",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

# The verified local worker uses the CPU PyTorch artifacts.  They are kept on
# the official PyTorch index rather than silently resolving a GPU build from a
# different registry at install time.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
environments = ["sys_platform == 'win32'"]

[project.scripts]
tajik-htr-api = "app.cli:run_api"
tajik-htr-worker = "app.cli:run_worker"
tajik-htr-issue-access-code = "app.cli:issue_access_code"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
